$kind: http-request
url: "{{baseUrl}}/api/Auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "phoneNumber": "{{testPhoneNumber}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK or Rate Limited 429', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 429]);
      });
      var jsonData = pm.response.json();
      if (jsonData.otp) {
          pm.environment.set('forgotOtp', jsonData.otp);
          console.log('Saved forgotOtp:', jsonData.otp);
      } else if (jsonData.message) {
          var match = jsonData.message.match(/(\d{6})/);
          if (match && match[1]) {
              pm.environment.set('forgotOtp', match[1]);
              console.log('Saved forgotOtp from message:', match[1]);
          }
      }
    language: text/javascript
order: 1000
