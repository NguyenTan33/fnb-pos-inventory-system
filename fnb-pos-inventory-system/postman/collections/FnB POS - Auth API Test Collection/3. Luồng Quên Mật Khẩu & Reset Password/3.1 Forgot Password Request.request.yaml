$kind: http-request
url: "{{baseUrl}}/api/Auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "phoneNumber": "{{testPhoneNumber}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      if (jsonData.message) {
          var match = jsonData.message.match(/Mã OTP là:\s*(\d+)/);
          if (match && match[1]) {
              pm.environment.set('forgotOtp', match[1]);
              console.log('Saved forgotOtp:', match[1]);
          }
      }
    language: text/javascript
order: 1000
